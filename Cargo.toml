[package]
name = "quotes"
version = "0.1.0"
edition = "2024"
description = "A portable SQLite-backed quote manager with a terminal UI"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
